<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="title desc">
  <title id="title">Cyber runner — animated arcade footer</title>
  <desc id="desc">A tiny hooded cyber runner races across a neon grid, jumps over firewall blocks, and collects glowing data tokens.</desc>
  <defs>
    <linearGradient id="bg" x2="0" y2="1"><stop stop-color="#0a1120"/><stop offset="1" stop-color="#070b13"/></linearGradient>
    <linearGradient id="neon"><stop stop-color="#00f5a0"/><stop offset=".5" stop-color="#48dfff"/><stop offset="1" stop-color="#b176ff"/></linearGradient>
    <linearGradient id="block" x2="0" y2="1"><stop stop-color="#293257"/><stop offset="1" stop-color="#101628"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="clip"><rect x="2" y="2" width="1196" height="266" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="270" fill="url(#bg)"/>
    <path d="M0 0H1200V177H0z" fill="#0c1522"/>
    <g fill="#65ffd0" font-family="monospace" font-size="12" opacity=".22">
      <text x="102" y="54">01011001<tspan x="392">10100110</tspan><tspan x="720">00110101</tspan><tspan x="1025">11001010</tspan></text>
      <text x="205" y="95">10100101<tspan x="545">01101010</tspan><tspan x="880">10110101</tspan></text>
      <text x="85" y="132">11010010<tspan x="457">00101011</tspan><tspan x="795">01101100</tspan><tspan x="1080">00110110</tspan></text>
    </g>
    <!-- retro arcade HUD -->
    <path d="M0 43H1200" stroke="url(#neon)" stroke-opacity=".45"/>
    <circle cx="27" cy="22" r="5" fill="#ff5f57"/><circle cx="46" cy="22" r="5" fill="#febc2e"/><circle cx="65" cy="22" r="5" fill="#28c840"/>
    <text x="600" y="27" text-anchor="middle" fill="#c1d8d8" font-family="monospace" font-weight="700" font-size="13" letter-spacing="2">CYBER ARCADE // FIREWALL RUN</text>
    <text x="1060" y="27" text-anchor="end" fill="#00f5a0" font-family="monospace" font-size="11">LEVEL 01</text>
    <text x="1145" y="27" text-anchor="end" fill="#68dcff" font-family="monospace" font-size="11">DATA <tspan fill="#fff">+128</tspan></text>
    <!-- pixel stars -->
    <g fill="#d5fff6"><rect x="160" y="65" width="3" height="3"><animate attributeName="opacity" values=".15;1;.15" dur="1.8s" repeatCount="indefinite"/></rect><rect x="680" y="72" width="3" height="3"><animate attributeName="opacity" values="1;.15;1" dur="2.2s" repeatCount="indefinite"/></rect><rect x="950" y="58" width="3" height="3"><animate attributeName="opacity" values=".15;1;.15" dur="1.4s" repeatCount="indefinite"/></rect></g>
    <!-- far moving grid -->
    <path d="M0 185H1200M0 205H1200M0 228H1200M0 255H1200" stroke="#1e6270" stroke-opacity=".48"/>
    <path d="M20 180 160 270M130 180 240 270M270 180 340 270M430 180 465 270M600 180 600 270M770 180 735 270M930 180 860 270M1080 180 970 270M1180 180 1050 270" stroke="#1e6270" stroke-opacity=".43"/>
    <path d="M0 180H1200" stroke="#00f5a0" stroke-opacity=".7" filter="url(#glow)"/>
    <!-- firewall obstacle one -->
    <g transform="translate(330 0)">
      <path d="M0 180h48v-43H0z" fill="url(#block)" stroke="#ff5c8a" stroke-width="2"/>
      <path d="M5 175h38v-33H5z" fill="none" stroke="#ff5c8a" stroke-opacity=".4"/>
      <path d="M8 156h30M18 144v28M31 144v28" stroke="#ff5c8a" stroke-opacity=".8"/>
      <text x="24" y="133" text-anchor="middle" fill="#ff7fa4" font-family="monospace" font-size="9">FIREWALL</text>
    </g>
    <!-- firewall obstacle two -->
    <g transform="translate(828 0)">
      <path d="M0 180h54v-57H0z" fill="url(#block)" stroke="#b176ff" stroke-width="2"/>
      <path d="M7 173h40v-43H7z" fill="none" stroke="#b176ff" stroke-opacity=".45"/>
      <path d="M10 150h34M19 132v41M34 132v41" stroke="#b176ff" stroke-opacity=".8"/>
      <text x="27" y="119" text-anchor="middle" fill="#c7a6ff" font-family="monospace" font-size="9">FIREWALL</text>
    </g>
    <!-- collectible data chips bob and spin -->
    <g filter="url(#glow)">
      <g transform="translate(510 149)"><animateTransform attributeName="transform" type="translate" values="510 149;510 140;510 149" dur="1.1s" repeatCount="indefinite"/><path d="M0-12 12 0 0 12-12 0z" fill="#00f5a0" fill-opacity=".25" stroke="#73ffe0" stroke-width="2"/><text x="0" y="4" text-anchor="middle" fill="#dffff8" font-family="monospace" font-size="9">+</text></g>
      <g transform="translate(690 149)"><animateTransform attributeName="transform" type="translate" values="690 149;690 139;690 149" dur="1.3s" repeatCount="indefinite"/><path d="M0-12 12 0 0 12-12 0z" fill="#42dfff" fill-opacity=".23" stroke="#8feaff" stroke-width="2"/><text x="0" y="4" text-anchor="middle" fill="#efffff" font-family="monospace" font-size="9">+</text></g>
      <g transform="translate(1080 150)"><animateTransform attributeName="transform" type="translate" values="1080 150;1080 140;1080 150" dur="1s" repeatCount="indefinite"/><path d="M0-12 12 0 0 12-12 0z" fill="#b176ff" fill-opacity=".23" stroke="#d5baff" stroke-width="2"/><text x="0" y="4" text-anchor="middle" fill="#fff" font-family="monospace" font-size="9">+</text></g>
    </g>
    <!-- runner shadow -->
    <ellipse cx="100" cy="180" rx="31" ry="6" fill="#00f5a0" opacity=".28"><animate attributeName="rx" values="31;25;31" dur=".65s" repeatCount="indefinite"/></ellipse>
    <!-- free-running loop across the level; hops at the two firewall positions -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="45 0;1080 0;45 0" keyTimes="0;.52;1" dur="12s" repeatCount="indefinite"/>
      <g>
        <animateTransform attributeName="transform" type="translate" values="0 0;0 0;0 -55;0 -55;0 0;0 0;0 -68;0 -68;0 0;0 0;0 -68;0 -68;0 0;0 0;0 -55;0 -55;0 0;0 0" keyTimes="0;.12;.15;.18;.21;.37;.4;.44;.47;.59;.61;.65;.67;.82;.84;.88;.9;1" dur="12s" repeatCount="indefinite"/>
        <!-- hood/body, compact pixel arcade hero -->
        <path d="M4 178q-8-18-4-34 3-15 18-23 16-8 31 2 12 8 14 24l-3 20 10 11H4z" fill="#111e32" stroke="#00f5a0" stroke-width="2"/>
        <path d="M6 146q10-23 29-23 15 0 23 14-13-5-22 1-8 6-8 18H8z" fill="#182e47" stroke="#8effe1" stroke-width="1.5"/>
        <path d="M16 147q12-8 29 0" stroke="#39efff" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
        <circle cx="31" cy="148" r="2" fill="#fff"/>
        <path d="M8 176v-12M23 178v-12M42 178v-12M57 176v-10" stroke="#67dfff" stroke-width="4" stroke-linecap="round"><animate attributeName="d" values="M8 176v-12M23 178v-12M42 178v-12M57 176v-10;M8 178v-10M23 176v-14M42 176v-14M57 178v-10;M8 176v-12M23 178v-12M42 178v-12M57 176v-10" dur=".45s" repeatCount="indefinite"/></path>
        <path d="M11 153h-9M63 153h9" stroke="#00f5a0" stroke-width="2" opacity=".75"/>
        <rect x="21" y="159" width="24" height="10" rx="3" fill="#0b2a2c" stroke="#00f5a0"/>
        <text x="33" y="167" text-anchor="middle" fill="#a4ffe7" font-family="monospace" font-size="7">RUN</text>
      </g>
    </g>
    <!-- pulse rings at checkpoints -->
    <circle cx="600" cy="178" r="8" fill="none" stroke="#56eaff" opacity=".7"><animate attributeName="r" values="5;27;5" dur="2.6s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;0;.7" dur="2.6s" repeatCount="indefinite"/></circle>
    <text x="52" y="246" fill="#819898" font-family="monospace" font-size="10" letter-spacing="1">MOVE: LEARN  /  JUMP: CREATE  /  POWER-UP: STAY CURIOUS</text>
    <text x="1148" y="246" text-anchor="end" fill="#00f5a0" font-family="monospace" font-size="10">GG // KEEP BUILDING</text>
  </g>
  <rect x="2" y="2" width="1196" height="266" rx="22" fill="none" stroke="url(#neon)" stroke-width="2" opacity=".8"/>
</svg>
