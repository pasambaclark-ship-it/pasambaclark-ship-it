<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">Cybersecurity themed animated terminal banner</title>
  <desc id="desc">A neon green terminal interface with a rotating shield, scanning line, and falling code.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071018"/><stop offset="1" stop-color="#101b27"/></linearGradient>
    <linearGradient id="edge"><stop stop-color="#00f5a0"/><stop offset=".5" stop-color="#00a9ff"/><stop offset="1" stop-color="#9d6bff"/></linearGradient>
    <linearGradient id="scan"><stop stop-color="#00f5a0" stop-opacity="0"/><stop offset=".5" stop-color="#00f5a0" stop-opacity=".55"/><stop offset="1" stop-color="#00f5a0" stop-opacity="0"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#70ffd0" stroke-opacity=".055" stroke-width="1"/></pattern>
    <filter id="glow"><feGaussianBlur stdDeviation="4" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="clip"><rect x="2" y="2" width="1196" height="376" rx="23"/></clipPath>
  </defs>
  <g clip-path="url(#clip)">
    <rect width="1200" height="380" fill="url(#bg)"/><rect width="1200" height="380" fill="url(#grid)"/>
    <circle cx="940" cy="170" r="205" fill="#00f5a0" opacity=".035"/>
    <g fill="#00f5a0" font-family="monospace" font-size="14" opacity=".23">
      <text x="785" y="44"><animate attributeName="y" values="44;370" dur="8s" repeatCount="indefinite"/>01001011</text>
      <text x="850" y="188"><animate attributeName="y" values="188;405" dur="6s" repeatCount="indefinite"/>10110100</text>
      <text x="1020" y="85"><animate attributeName="y" values="85;390" dur="9s" repeatCount="indefinite"/>00101101</text>
      <text x="1120" y="220"><animate attributeName="y" values="220;410" dur="7s" repeatCount="indefinite"/>11001010</text>
      <text x="740" y="250"><animate attributeName="y" values="250;400" dur="10s" repeatCount="indefinite"/>00110110</text>
    </g>
    <rect x="2" y="2" width="1196" height="376" rx="23" fill="none" stroke="url(#edge)" stroke-width="2" opacity=".8"/>
    <rect x="3" y="2" width="1194" height="42" fill="#0b151e" opacity=".94"/>
    <circle cx="30" cy="23" r="6" fill="#ff5f57"/><circle cx="51" cy="23" r="6" fill="#febc2e"/><circle cx="72" cy="23" r="6" fill="#28c840"/>
    <text x="600" y="28" text-anchor="middle" fill="#75928e" font-family="monospace" font-size="13">SECURE SHELL — LEARNING ENVIRONMENT</text>
    <g font-family="monospace">
      <text x="62" y="111" fill="#00f5a0" font-size="17">clark@learning-lab <tspan fill="#73818d">~</tspan> $</text>
      <text x="62" y="160" fill="#e4fff5" font-size="29" font-weight="700">BUILD WITH PURPOSE.</text>
      <text x="62" y="202" fill="#e4fff5" font-size="29" font-weight="700">LEARN TO DEFEND.</text>
      <text x="62" y="248" fill="#8ba49f" font-size="16">Software · Security · Creative thinking</text>
      <text x="62" y="305" fill="#00f5a0" font-size="15">&gt; initializing curiosity<span fill="#00f5a0">_</span><animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.7;0.75;0.9;1" dur="1.1s" repeatCount="indefinite"/></text>
    </g>
    <g transform="translate(946 202)" filter="url(#glow)">
      <circle r="105" fill="none" stroke="#00f5a0" stroke-opacity=".14" stroke-width="1"><animate attributeName="r" values="88;112;88" dur="4s" repeatCount="indefinite"/></circle>
      <circle r="84" fill="none" stroke="#00c98b" stroke-opacity=".45" stroke-width="1" stroke-dasharray="3 9"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="24s" repeatCount="indefinite"/></circle>
      <path d="M0-58 48-40v44c0 37-24 59-48 76C-24 63-48 41-48 4v-44z" fill="#071a1a" stroke="#00f5a0" stroke-width="2.5"/>
      <path d="m-24 1 16 16 34-38" fill="none" stroke="#8effd3" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
      <circle r="71" fill="none" stroke="#00f5a0" stroke-opacity=".1" stroke-width="1"><animate attributeName="r" values="71;77;71" dur="2s" repeatCount="indefinite"/></circle>
    </g>
    <rect x="0" y="0" width="1200" height="4" fill="url(#scan)" opacity=".55"><animate attributeName="y" values="0;380;0" dur="7s" repeatCount="indefinite"/></rect>
    <path d="M0 344H1200" stroke="#00f5a0" stroke-opacity=".1"/>
    <text x="62" y="366" fill="#5b7772" font-family="monospace" font-size="11">STATUS: STUDENT / DEVELOPER / CYBERSECURITY ENTHUSIAST</text>
    <text x="1137" y="366" text-anchor="end" fill="#00d995" font-family="monospace" font-size="11">● ONLINE</text>
  </g>
</svg>
